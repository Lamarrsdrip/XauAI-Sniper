name: Checkout Security Lockfile Remediation

on:
  push:
    branches:
      - feat/xaucloud-premium-usd-manual-20261102
    paths:
      - .github/workflows/checkout-security-remediation.yml

permissions:
  contents: write

jobs:
  remediate-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend_node/package-lock.json
      - name: Apply compatible npm security fixes
        working-directory: backend_node
        run: |
          npm audit fix --package-lock-only || true
          npm ci
          npm test -- --run --silent
          npm run typecheck
          npm run build
          npm audit --omit=dev --audit-level=high
      - name: Commit lockfile only on fully verified remediation
        run: |
          if git diff --quiet -- backend_node/package-lock.json; then
            echo "No lockfile changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend_node/package-lock.json
          git commit -m "fix(security): refresh compatible production dependency locks"
          git push origin HEAD:feat/xaucloud-premium-usd-manual-20261102
