name: XauCloud Audit Validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  frontend-production:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build production frontend
        working-directory: frontend
        run: CI=true npm run build
      - name: Run frontend tests
        working-directory: frontend
        run: CI=true npm test -- --watchAll=false
      - name: Sync and verify production bundle
        working-directory: frontend
        run: |
          node ../scripts/sync-frontend.mjs
          test -s ../backend_node/public/index.html
          node - <<'NODE'
          const fs = require("fs");
          const path = require("path");
          const root = path.resolve("../backend_node/public");
          const html = fs.readFileSync(path.join(root, "index.html"), "utf8");
          const refs = [...html.matchAll(/(?:src|href)="\/([^"]+\.(?:js|css))"/g)].map(m => m[1]);
          if (!refs.length) throw new Error("No generated JS/CSS assets referenced");
          for (const ref of refs) {
            const p = path.join(root, ref);
            if (!fs.existsSync(p) || fs.statSync(p).size === 0) throw new Error(`Missing generated asset: ${p}`);
          }
          console.log(`Verified ${refs.length} generated production assets`);
          NODE

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci
      - name: Mobile unit tests
        working-directory: mobile
        run: npm run test:unit
      - name: Mobile TypeScript check
        working-directory: mobile
        run: npx tsc --noEmit
