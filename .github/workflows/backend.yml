name: Backend

on:
  push:
    branches: [main, "release/**"]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    branches: [main, "release/**"]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand(\"ping\")' || mongo --eval 'db.runCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      MONGO_URL: mongodb://localhost:27017
      JWT_SECRET: ci-test-secret-not-for-production
      ADMIN_EMAIL: ci-admin@test.com
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Real import/startup test: proves the app object actually
      # constructs (module-level code runs, all routes register) rather
      # than only checking syntax. This is the exact class of failure
      # that took this project down before (a package declared in
      # requirements.txt but never actually installed) -- catching it
      # here means it can never reach a merge to main undetected again.
      - name: Import/startup smoke test
        working-directory: backend
        run: |
          python -c "import server; print('server.py imports and app object constructs OK')"

      - name: Lint (flake8, errors only -- not a style gate)
        working-directory: backend
        run: |
          python -m flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        continue-on-error: false

      - name: Run pytest (security + business-logic suite)
        working-directory: backend
        run: |
          python -m pytest tests/ -v --tb=short
