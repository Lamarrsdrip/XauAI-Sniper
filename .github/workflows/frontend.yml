name: Frontend

on:
  push:
    branches: [main, "release/**"]
    paths:
      - "frontend/**"
      - "backend_node/public/**"
      - "scripts/sync-frontend.mjs"
      - ".github/workflows/frontend.yml"
  pull_request:
    branches: [main, "release/**"]
    paths:
      - "frontend/**"
      - "backend_node/public/**"
      - "scripts/sync-frontend.mjs"
      - ".github/workflows/frontend.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Production build
        working-directory: frontend
        run: CI=true npm run build

      - name: Frontend contract tests
        working-directory: frontend
        run: CI=true npm test -- --watchAll=false

      - name: Verify generated production frontend bundle
        working-directory: frontend
        run: |
          node ../scripts/sync-frontend.mjs
          # backend_node/public is generated deployment output. Validate the
          # generated index and every referenced JS/CSS asset instead of
          # requiring content-hashed CRA artifacts to be committed to Git.
          test -s ../backend_node/public/index.html
          node - <<'NODE'
          const fs = require("fs");
          const path = require("path");
          const root = path.resolve("../backend_node/public");
          const html = fs.readFileSync(path.join(root, "index.html"), "utf8");
          const refs = [...html.matchAll(/(?:src|href)="\/([^"]+\.(?:js|css))"/g)].map((m) => m[1]);
          if (!refs.length) throw new Error("No JS/CSS assets referenced by generated index.html");
          for (const ref of refs) {
            const p = path.join(root, ref);
            if (!fs.existsSync(p) || fs.statSync(p).size === 0) throw new Error(`Missing generated asset: ${p}`);
          }
          console.log(`Verified ${refs.length} generated production frontend assets`);
          NODE

      # Real route-reachability smoke test: catches a broken build that
      # nonetheless produced a bundle (e.g. a runtime-only error that
      # webpack doesn't fail on). Not a full Playwright E2E suite -- see
      # the workflow-level comment below for why that's not included yet.
      - name: Static-serve smoke test (root route responds)
        working-directory: frontend
        run: |
          npx serve -s build -l 4173 &
          SERVER_PID=$!
          sleep 3
          curl -sf http://localhost:4173/ > /dev/null && echo "root route OK"
          kill $SERVER_PID

# ---------------------------------------------------------------------
# NOT YET IN THIS WORKFLOW (disclosed honestly rather than faked):
# - Historical UI contracts outside the 14 current frontend suites remain
#   release-scoped and are not treated as current layout requirements unless
#   their corresponding surface is being promoted.
# - Accessibility smoke test / Playwright E2E: not set up. Both require
#   either a live backend + MongoDB to exercise real login/purchase/
#   license flows, or extensive mocking that risks testing the mocks
#   instead of the product. A real E2E suite is a dedicated follow-up,
#   not something to bolt on superficially here.
# ---------------------------------------------------------------------
