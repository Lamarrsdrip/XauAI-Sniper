name: Frontend

# TEMPORARY repair authority: same-repository PRs may commit the exact CRA
# bundle produced by this workflow back to their own head branch. This is
# removed after the bundle is synchronized.
permissions:
  contents: write

on:
  push:
    branches: [main, "release/**"]
    paths:
      - "frontend/**"
      - "backend_node/public/**"
      - "scripts/sync-frontend.mjs"
      - ".github/workflows/frontend.yml"
  pull_request:
    branches: [main, "release/**"]
    paths:
      - "frontend/**"
      - "backend_node/public/**"
      - "scripts/sync-frontend.mjs"
      - ".github/workflows/frontend.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Production build
        working-directory: frontend
        run: CI=true npm run build

      - name: Frontend contract tests
        working-directory: frontend
        run: CI=true npm test -- --watchAll=false

      # Short-retention build artifact gives maintainers the exact CRA output
      # that the synchronization gate validates. This is especially useful
      # when a source change intentionally rotates hashed bundle filenames.
      - name: Upload production frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-production-build
          path: frontend/build
          retention-days: 1
          if-no-files-found: error

      - name: Synchronize deployed frontend bundle
        working-directory: frontend
        run: |
          node ../scripts/sync-frontend.mjs
          cd ..
          # Intent-to-add makes newly hashed CRA assets visible to the drift check.
          git add -N backend_node/public
          if git diff --quiet -- backend_node/public; then
            echo "deployed bundle already synchronized"
            exit 0
          fi

          # Same-repository repair branch only: preserve the exact build output,
          # switch from the PR merge ref to the real head branch, then commit the
          # generated deployment bundle there. Main/release pushes remain fail-closed.
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ] || [ -z "$GITHUB_HEAD_REF" ]; then
            echo "frontend deployment bundle is out of sync"
            git diff -- backend_node/public
            exit 1
          fi

          rm -rf /tmp/backend_node_public_synced
          cp -a backend_node/public /tmp/backend_node_public_synced
          git reset --hard
          git clean -fd backend_node/public
          git fetch origin "$GITHUB_HEAD_REF"
          git checkout -B "$GITHUB_HEAD_REF" "origin/$GITHUB_HEAD_REF"
          rm -rf backend_node/public/static
          cp -a /tmp/backend_node_public_synced/. backend_node/public/
          git add backend_node/public
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(frontend): synchronize production bundle"
          git push origin "HEAD:$GITHUB_HEAD_REF"

      # Real route-reachability smoke test: catches a broken build that
      # nonetheless produced a bundle (e.g. a runtime-only error that
      # webpack doesn't fail on). Not a full Playwright E2E suite -- see
      # the workflow-level comment below for why that's not included yet.
      - name: Static-serve smoke test (root route responds)
        working-directory: frontend
        run: |
          npx serve -s build -l 4173 &
          SERVER_PID=$!
          sleep 3
          curl -sf http://localhost:4173/ > /dev/null && echo "root route OK"
          kill $SERVER_PID

# ---------------------------------------------------------------------
# NOT YET IN THIS WORKFLOW (disclosed honestly rather than faked):
# - Historical UI contracts outside the 14 current frontend suites remain
#   release-scoped and are not treated as current layout requirements unless
#   their corresponding surface is being promoted.
# - Accessibility smoke test / Playwright E2E: not set up. Both require
#   either a live backend + MongoDB to exercise real login/purchase/
#   license flows, or extensive mocking that risks testing the mocks
#   instead of the product. A real E2E suite is a dedicated follow-up,
#   not something to bolt on superficially here.
# ---------------------------------------------------------------------
