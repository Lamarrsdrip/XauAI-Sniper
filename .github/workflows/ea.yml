name: EA (MQL5 source)

on:
  push:
    branches: [main, "release/**"]
    paths:
      - "**.mq5"
      - "**.mqh"
      - "tests/test_xau_*.py"
      - "backend/ea_releases/**"
      - "scripts/auto_promote_release.py"
      - ".github/workflows/ea.yml"
  pull_request:
    branches: [main, "release/**"]
    paths:
      - "**.mq5"
      - "**.mqh"
      - "tests/test_xau_*.py"
      - "backend/ea_releases/**"
      - "scripts/auto_promote_release.py"
      - ".github/workflows/ea.yml"

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest

      # This is the real, honest scope of what this job can do. See the
      # NOT COVERED block below for what it deliberately does not claim.
      - name: Authoritative production source and compatibility-path check
        run: |
          test -d backend/ea_code
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path

          manifest = json.loads(Path("backend/ea_releases/manifest.json").read_text())
          current = manifest["current_version"]
          release = manifest["releases"][current]
          source_name = release.get("source_filename", "XauCloud-Final.mq5")
          source = Path("backend/ea_code") / source_name
          assert source.name == source_name and source.is_file(), f"invalid production source: {source_name}"
          expected = release["source_sha256"]
          actual = hashlib.sha256(source.read_bytes()).hexdigest()
          assert actual == expected, f"production source hash mismatch: {actual} != {expected}"
          print(f"{source_name} matches manifest source_sha256={actual}")
          PY

      - name: Current production-audit regression suite
        run: |
          python -m pytest \
            tests/test_xaucloud_pattern_breakout_promotion.py \
            tests/test_utf16_tester_event_extractor.py \
            tests/test_xau_outlook_missed_entry_recovery_contract.py \
            -v --tb=short

      - name: EX5 release artifact checksum verification
        run: |
          python3 - <<'PY'
          import json, hashlib, sys
          manifest = json.load(open("backend/ea_releases/manifest.json"))
          current = manifest["current_version"]
          release = manifest["releases"][current]
          ex5_path = f"backend/ea_releases/{current}/{release['ex5_filename']}"
          actual = hashlib.sha256(open(ex5_path, "rb").read()).hexdigest()
          expected = release["ex5_sha256"]
          print(f"manifest current_version={current}")
          print(f"expected sha256={expected}")
          print(f"actual   sha256={actual}")
          if actual != expected:
              print("MISMATCH -- the committed EX5 artifact does not match its own manifest entry")
              sys.exit(1)
          print("EX5 artifact checksum matches manifest -- OK")
          PY

  auto-promote-release:
    # Only ever runs on a real push to main (never a PR -- promotion must
    # never happen against unmerged/unreviewed code), and only after
    # static-checks has confirmed the currently-pinned release is itself
    # consistent, so a pre-existing problem with the OLD current_version
    # never blocks promoting a genuinely newer, valid one.
    #
    # This is the durable half of release promotion (see
    # backend/server.py's admin /admin/releases/promote endpoint for the
    # immediate-but-not-durable admin-panel half): current_version is
    # updated as part of a real commit on main, so it survives every future
    # redeploy, unlike a live edit to the running container's filesystem.
    needs: static-checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Decide and apply promotion
        id: promote
        run: python3 scripts/auto_promote_release.py

      - name: Commit and push promoted manifest
        if: steps.promote.outputs.promoted == 'true'
        run: |
          git config user.name "xaucloud-release-bot"
          git config user.email "release-bot@users.noreply.github.com"
          git add backend/ea_releases/manifest.json
          # [skip ci] prevents this bot commit from re-triggering this same
          # workflow -- it only touches manifest.json, which this workflow's
          # own path filters would otherwise pick back up, and the
          # promotion decision is already final once applied.
          git commit -m "chore(release): auto-promote to ${{ steps.promote.outputs.version }} [skip ci]"
          git push

# ---------------------------------------------------------------------
# NOT COVERED BY THIS WORKFLOW (disclosed honestly rather than faked):
#
# - Real MetaEditor compilation ("0 errors, 0 warnings"). MetaEditor64.exe
#   is Windows-only, requires a real MetaTrader 5 terminal install, and
#   this project has no self-hosted Windows/MT5 runner registered against
#   this repository. GitHub-hosted runners cannot run it. Every EA change
#   in this project has instead been compiled manually in a local wine+
#   MetaEditor sandbox and the result (errors/warnings count + EX5 SHA-256)
#   recorded in backend/ea_releases/manifest.json and the commit message
#   for that change -- this workflow verifies that recorded artifact's
#   checksum stays consistent with what's actually committed, but it does
#   NOT re-run the compiler itself.
# - Mac live install / VPS deployment verification. Both are real physical/
#   remote machines outside any CI runner's reach.
# - Historical release-pin suites. Many old tests intentionally assert the
#   exact version/build text and behavior of their original release. The
#   current workflow runs the current production-audit invariants instead;
#   the historical suite remains available as evidence but is not a valid
#   current-release gate until it is explicitly retired or version-scoped.
# - Redeployment. auto-promote-release updates manifest.json's
#   current_version on main (durable, survives a redeploy) but this
#   workflow has no credentials for and does not trigger the Hostinger Web App
#   deploy. Production is connected to GitHub `main` and Hostinger's
#   auto-deployment publishes the current backend_node build.
# ---------------------------------------------------------------------
