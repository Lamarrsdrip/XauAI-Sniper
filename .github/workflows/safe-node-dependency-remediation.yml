name: One-shot safe Node dependency remediation
on:
  push:
    branches:
      - feat/xaucloud-premium-usd-manual-20261102
    paths:
      - .github/workflows/safe-node-dependency-remediation.yml
permissions:
  contents: write
jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/xaucloud-premium-usd-manual-20261102
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend_node/package-lock.json
      - name: Install reproducibly
        working-directory: backend_node
        run: npm ci --no-fund
      - name: Apply compatible production security patches to lockfile only
        working-directory: backend_node
        run: npm audit fix --package-lock-only --omit=dev --no-fund || true
      - name: Install and test revised lockfile
        working-directory: backend_node
        run: |
          npm ci --no-fund
          npm run typecheck
          npm test -- --run
          npm run build
          npm audit --omit=dev --audit-level=high
      - name: Commit safe dependency changes only after full checks pass
        run: |
          git config user.name 'xaucloud-security-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend_node/package-lock.json backend_node/package.json
          if ! git diff --cached --quiet; then
            git commit -m 'fix(security): resolve compatible production Node dependency advisories'
            git push origin HEAD:feat/xaucloud-premium-usd-manual-20261102
          fi
